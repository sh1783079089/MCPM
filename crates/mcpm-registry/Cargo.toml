[package]
name = "mcpm-registry"
version.workspace = true
edition.workspace = true

[dependencies]
mcpm-core = { path = "../mcpm-core" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros"] }