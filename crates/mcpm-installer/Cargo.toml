[package]
name = "mcpm-installer"
version.workspace = true
edition.workspace = true

[dependencies]
mcpm-core = { path = "../mcpm-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros"] }
reqwest = { version = "0.12", features = ["stream"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tracing = "0.1"
indicatif = "0.17"
futures = "0.3"

[dev-dependencies]
tempfile = "3"