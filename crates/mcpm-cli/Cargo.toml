[package]
name = "mcpm-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mcpm"
path = "src/main.rs"

[dependencies]
mcpm-core = { path = "../mcpm-core" }
mcpm-registry = { path = "../mcpm-registry" }
mcpm-resolver = { path = "../mcpm-resolver" }
mcpm-installer = { path = "../mcpm-installer" }
mcpm-metadata = { path = "../mcpm-metadata" }
mcpm-export = { path = "../mcpm-export" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
anyhow = "1"
serde_json = "1"
toml = "0.8"
indexmap = "2"
rust-i18n = "4"
sys-locale = "0.3"