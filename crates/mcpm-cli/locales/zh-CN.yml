---
_version: 1
cli:
  about: "Minecraft 模组包管理器"
  init:
    help: "初始化新模组包"
    success: "已初始化模组包 '%{name}'，Minecraft %{mc} + %{loader}"
  add:
    help: "添加模组到模组包"
    searching: "正在 Modrinth 上搜索 '%{slug}'..."
    found: "已找到：%{title} (%{id})"
    compatible: "  兼容版本：%{version} (%{release_type})"
    added: "已将 '%{title}' 添加到模组包"
    already_exists: "模组 '%{slug}' 已在模组包中"
    no_results: "未找到 '%{slug}' 的结果"
    no_compatible: "'%{title}' 没有与 Minecraft %{mc} + %{loader} 兼容的版本（已检查 %{count} 个版本）"
    all_in_lockfile: "所有依赖已在 lockfile 中。"
  remove:
    help: "从模组包移除模组"
    removed_config: "已从配置移除 '%{slug}'"
    removed_file: "  已删除：mods/%{filename}"
    not_found: "'%{slug}' 不在模组包中"
  autoremove:
    help: "移除孤立的依赖"
    none: "未发现孤立的依赖。"
    found: "发现 %{count} 个孤立的依赖："
    dep_line: "  %{name} %{version} [依赖]"
    removed_config: "  已从配置移除 '%{slug}'"
  install:
    help: "解析依赖并安装模组"
    no_lockfile: "未找到 lockfile。请先用 'mcpm add <模组>' 添加模组。"
    resolving: "正在为 Minecraft %{mc} + %{loader} 解析..."
    resolved: "已解析 %{count} 个模组："
    mod_line: "  %{name} %{version} [%{reason}]"
    lockfile_written: "Lockfile 已写入 %{path}"
    installed: "  已安装：%{filename}"
    install_error: "  安装 %{filename} 失败：%{error}"
    manual_download: "  手动下载：请从 %{url} 下载 %{filename} 并放入 mods/"
    manual_download_no_url: "  手动下载：%{filename} 无法自动下载，请自行获取并放入 mods/"
    complete: "安装完成：%{installed} 已安装，%{skipped} 已是最新"
    with_errors: "安装完成，但有 %{count} 个错误"
  list:
    help: "列出 lockfile 中的模组"
    no_lockfile: "未找到 lockfile。请先运行 'mcpm install'。"
    header_name: "名称"
    header_version: "版本"
    header_source: "来源"
    header_reason: "原因"
    total: "共 %{count} 个模组"
  check:
    help: "检查已解析模组包的问题"
    no_lockfile: "未找到 lockfile。请先运行 'mcpm install'。"
    env_line: "环境：Minecraft %{mc} + %{loader}"
    mod_count: "Lockfile 中的模组数：%{count}"
    mod_line: "  ✓ %{name} %{version}"
    jar_summary: "已扫描 mods/ 下 %{mods} 个 jar"
    parse_error: "  解析失败 %{filename}：%{error}"
    duplicate_id: "  重复的模组 id '%{id}'"
    side_conflict: "  端不匹配 '%{id}' 为 %{mod_side}，但整合包端为 %{expected}（%{filename}）"
    loader_mismatch: "  加载器不匹配 '%{id}' 为 %{actual}，但整合包为 %{expected}（%{filename}）"
    missing_dependency: "  缺少依赖 '%{id}' 需要 '%{missing}'（%{filename}）"
    loader_requirement: "  加载器版本要求 %{requirement}"
    complete: "检查完成。"
  solve_env:
    help: "探索并排序候选环境"
    title: "最佳环境："
    candidate: "%{index}. Minecraft %{mc} + %{loader}"
    requested: "   可用请求模组：%{available}/%{total}"
    missing: "   缺失：%{mods}"
    dependencies: "   依赖数：%{count}"
    risks: "   已知风险：%{warnings} 个警告，%{conflicts} 个冲突"
    score: "   评分：%{score}"
    none: "未生成任何候选环境。"
  use:
    help: "应用 solve-env 中的候选环境"
    invalid_index: "无效的候选序号 %{index}（有效范围：1-%{max}）"
    selected: "已选择环境：Minecraft %{mc} + %{loader}"
  lock_env:
    help: "将解析出的环境锁定到配置"
    multiple: "存在多个候选环境；请使用 --choose <n>"
  un_lock_env:
    help: "将环境还原为探索态"
    not_locked: "环境已处于探索态"
    unlocked: "已解锁环境：Minecraft %{minecraft}"
  update:
    help: "在当前环境内安全更新模组"
    no_lockfile: "未找到 lockfile。请先添加模组并运行 'mcpm install'。"
  upgrade_env:
    help: "升级 Minecraft 版本（显式、基于计划）"
    upgraded: "环境已升级到 Minecraft %{mc}"
  migrate_loader:
    help: "迁移到其他加载器类型（显式、基于计划）"
    migrated: "已迁移到加载器 %{loader}"
  apply_plan:
    help: "应用最近生成的更新计划"
  import:
    help: "将现有内容导入模组包"
    no_mods_dir: "未找到 mods/ 目录"
    empty: "mods/ 中没有 jar 文件"
    scanning: "正在扫描 mods/ 下的 %{count} 个 jar 文件..."
    parse_error: "  解析失败 %{filename}：%{error}"
    duplicate_id: "  重复的模组 id '%{id}' 已跳过"
    local_mod: "  本地模组 '%{id}' 未在 Modrinth 找到，已标记为 local"
    add_entry: "  + %{key}"
    overwrite_entry: "  ~ %{key}（覆盖）"
    skip_existing: "  = %{key}（已存在，跳过）"
    summary: "导入结果：新增 %{added}，跳过 %{skipped}，本地 %{local}"
    dry_run: "预览模式：未写入任何更改。"
    written: "已更新 %{path}。"
  import_cf:
    parse_error: "解析 CurseForge manifest 失败：%{error}"
    no_files: "manifest 不包含任何文件"
    no_api_key: "未配置 CurseForge API key；请设置 CURSEFORGE_API_KEY 或用户配置"
    project_error: "  解析项目 %{id} 失败：%{error}"
    summary: "CurseForge manifest 导入完成：新增 %{added}，跳过 %{skipped}，失败 %{failed}"
  export:
    help: "将模组包导出为外部格式"
  export_cf:
    skipped: "  已跳过 '%{name}'（非 CurseForge 来源）"
    write_error: "写入 manifest 失败：%{error}"
    written: "已写入 %{path}：%{count} 个文件，跳过 %{skipped} 个"
  plan:
    header: "更新计划："
    install: "  + 安装 %{name} %{version}"
    update: "  ~ 更新 %{name} %{from} -> %{to}"
    remove: "  - 移除 %{name}"
    no_changes: "已是最新。"
    conflicts_block: "计划存在未解决的冲突，未应用"
    applied: "计划已应用。"
  resolve:
    conflict: "冲突：%{message}"
    warning: "警告：%{message}"
    workaround: "变通方案：%{message}"
    reason_requested: "请求"
    reason_dependency: "依赖"
  common:
    source_modrinth: "modrinth"
    error_prefix: "错误"
  error:
    unknown_loader: "未知加载器 '%{loader}'。支持：fabric、quilt、forge、neoforge"
    unknown_side: "未知端 '%{side}'。支持：client、server、both"
    loader_not_fixed: "环境加载器必须是固定类型才能解析"
    load_config: "读取 %{file} 失败"
    parse_config: "解析 %{file} 失败"
    save_config: "写入 %{file} 失败"
    serialize_config: "序列化配置失败"
    create_mods_dir: "创建 mods 目录失败"
    create_mcpm_dir: "创建 .mcpm 目录失败"
