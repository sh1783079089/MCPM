---
_version: 1
cli:
  about: "Minecraft Package Manager"
  init:
    help: "Initialize a new modpack"
    success: "Initialized modpack '%{name}' with Minecraft %{mc} + %{loader}"
  add:
    help: "Add a mod to the modpack"
    searching: "Searching for '%{slug}' on Modrinth..."
    found: "Found: %{title} (%{id})"
    compatible: "  Compatible version: %{version} (%{release_type})"
    added: "Added '%{title}' to modpack"
    already_exists: "mod '%{slug}' is already in the modpack"
    no_results: "no results found for '%{slug}'"
    no_compatible: "'%{title}' has no versions compatible with Minecraft %{mc} + %{loader} (%{count} versions checked)"
    all_in_lockfile: "All dependencies already in lockfile."
  remove:
    help: "Remove a mod from the modpack"
    removed_config: "Removed '%{slug}' from config"
    removed_file: "  Removed: mods/%{filename}"
    not_found: "'%{slug}' is not in the modpack"
  autoremove:
    help: "Remove orphaned dependencies"
    none: "No orphaned dependencies found."
    found: "Found %{count} orphaned dependencies:"
    dep_line: "  %{name} %{version} [dependency]"
    removed_config: "  Removed '%{slug}' from config"
  install:
    help: "Resolve dependencies and install mods"
    no_lockfile: "no lockfile found. Add mods first with 'mcpm add <mod>'."
    resolving: "Resolving for Minecraft %{mc} + %{loader}..."
    resolved: "Resolved %{count} mod(s):"
    mod_line: "  %{name} %{version} [%{reason}]"
    lockfile_written: "Lockfile written to %{path}"
    installed: "  Installed: %{filename}"
    install_error: "  Error installing %{filename}: %{error}"
    manual_download: "  MANUAL: download %{filename} from %{url} and place it in mods/"
    manual_download_no_url: "  MANUAL: %{filename} cannot be downloaded automatically; obtain it and place it in mods/"
    complete: "Install complete: %{installed} installed, %{skipped} up-to-date"
    with_errors: "install completed with %{count} error(s)"
  list:
    help: "List mods in the lockfile"
    no_lockfile: "no lockfile found. Run 'mcpm install' first."
    header_name: "Name"
    header_version: "Version"
    header_source: "Source"
    header_reason: "Reason"
    total: "Total: %{count} mod(s)"
  check:
    help: "Check for issues in the resolved modpack"
    no_lockfile: "no lockfile found. Run 'mcpm install' first."
    env_line: "Environment: Minecraft %{mc} + %{loader}"
    mod_count: "Mods in lockfile: %{count}"
    mod_line: "  ✓ %{name} %{version}"
    jar_summary: "Scanned %{mods} jar(s) in mods/"
    parse_error: "  PARSE ERROR %{filename}: %{error}"
    duplicate_id: "  DUPLICATE mod id '%{id}'"
    side_conflict: "  SIDE '%{id}' is %{mod_side} but pack side is %{expected} (%{filename})"
    loader_mismatch: "  LOADER '%{id}' is %{actual} but pack loader is %{expected} (%{filename})"
    missing_dependency: "  MISSING '%{id}' requires '%{missing}' (%{filename})"
    loader_requirement: "  LOADER VERSION %{requirement}"
    complete: "Check complete."
  solve_env:
    help: "Explore and rank candidate environments"
    title: "Best environments:"
    candidate: "%{index}. Minecraft %{mc} + %{loader}"
    requested: "   Requested mods available: %{available}/%{total}"
    missing: "   Missing: %{mods}"
    dependencies: "   Dependencies: %{count}"
    risks: "   Known risks: %{warnings} warning(s), %{conflicts} conflict(s)"
    score: "   Score: %{score}"
    none: "No candidate environments generated."
  use:
    help: "Apply a candidate environment from solve-env"
    invalid_index: "invalid candidate index %{index} (valid: 1-%{max})"
    selected: "Selected environment: Minecraft %{mc} + %{loader}"
  lock_env:
    help: "Lock the resolved environment into the config"
    multiple: "multiple candidate environments found; use --choose <n>"
  un_lock_env:
    help: "Restore the environment to explore mode"
    not_locked: "environment is already in explore mode"
    unlocked: "Unlocked environment: Minecraft %{minecraft}"
  update:
    help: "Update mods safely within the current environment"
    no_lockfile: "no lockfile found. Add mods and run 'mcpm install' first."
  upgrade_env:
    help: "Upgrade the Minecraft version (explicit, plan-based)"
    upgraded: "Environment upgraded to Minecraft %{mc}"
  migrate_loader:
    help: "Migrate to another loader type (explicit, plan-based)"
    migrated: "Migrated to loader %{loader}"
  apply_plan:
    help: "Apply the last generated update plan"
  import:
    help: "Import existing content into the modpack"
    no_mods_dir: "no mods/ directory found"
    empty: "no jar files found in mods/"
    scanning: "Scanning %{count} jar file(s) in mods/..."
    parse_error: "  PARSE ERROR %{filename}: %{error}"
    duplicate_id: "  DUPLICATE mod id '%{id}' skipped"
    local_mod: "  LOCAL '%{id}' not found on Modrinth; marked as local"
    add_entry: "  + %{key}"
    overwrite_entry: "  ~ %{key} (overwrite)"
    skip_existing: "  = %{key} (already present, skipped)"
    summary: "Imported: %{added} added, %{skipped} skipped, %{local} local"
    dry_run: "Dry run: no changes written."
    written: "Updated %{path}."
  plan:
    header: "Update plan:"
    install: "  + install %{name} %{version}"
    update: "  ~ update %{name} %{from} -> %{to}"
    remove: "  - remove %{name}"
    no_changes: "Already up to date."
    conflicts_block: "plan has unresolved conflicts; not applying"
    applied: "Plan applied."
  resolve:
    conflict: "CONFLICT: %{message}"
    warning: "WARNING: %{message}"
    workaround: "WORKAROUND: %{message}"
    reason_requested: "requested"
    reason_dependency: "dependency"
  common:
    source_modrinth: "modrinth"
    error_prefix: "error"
  error:
    unknown_loader: "unknown loader '%{loader}'. Supported: fabric, quilt, forge, neoforge"
    unknown_side: "unknown side '%{side}'. Supported: client, server, both"
    loader_not_fixed: "environment loader must be fixed for resolution"
    load_config: "failed to read %{file}"
    parse_config: "failed to parse %{file}"
    save_config: "failed to write %{file}"
    serialize_config: "failed to serialize config"
    create_mods_dir: "failed to create mods directory"
    create_mcpm_dir: "failed to create .mcpm directory"
